version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npx prisma generate
        - echo "DATABASE_URL is set = $(if [ -n \"$DATABASE_URL\" ]; then echo YES; else echo NO; fi)"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
