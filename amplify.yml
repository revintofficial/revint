version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - echo "DATABASE_URL set = $(if [ -n \"$DATABASE_URL\" ]; then echo YES; else echo NO; fi)"
        - echo "GEMINI_API_KEY set = $(if [ -n \"$GEMINI_API_KEY\" ]; then echo YES; else echo NO; fi)"
        - echo "GOOGLE_PLACES_API_KEY set = $(if [ -n \"$GOOGLE_PLACES_API_KEY\" ]; then echo YES; else echo NO; fi)"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
