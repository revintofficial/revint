version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npx prisma generate
        - env | grep -e DATABASE_URL -e GEMINI_API_KEY -e GOOGLE_PLACES_API_KEY | head -c 100 || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
