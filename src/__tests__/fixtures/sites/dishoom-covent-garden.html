<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Do I need to book a table at Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"Book anytime before 6pm. After 6pm, bookings are open for groups of 6+. If your desired time isn’t available, simply come along – we keep most of our tables for walk-ins."}},{"@type":"Question","name":"What time is breakfast and brunch served in Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"Breakfast is served Monday to Friday from 8am – 11.45am and Saturday to Sunday from 9am – 11.45am. The All Day menu is served from 12pm daily for delicious lunches, afternoon snacks, dinner and late-night tipples."}},{"@type":"Question","name":"Can I book private group dining spaces at Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"Dishoom Covent Garden does not offer private dining. We do, however, welcome Group Bookings of 10–16 guests in our café, morning ’til night. Chef-wallas lovingly prepare café favourites from our Breakfast Feast or Group Feast menus (non-veg., veg. and vegan options for all). For Group Bookings: simply enquire here.\n\nIf seeking a private or semi-private space, Dishoom Shoreditch has plenty of options (up to 45 guests) and Dishoom Canary Wharf takes up to 32 guests, while Dishoom King’s Cross has a semi-private Chef’s Table for intimate gatherings (up to 14 guests). For private parties over Portobello Road, book out the fancy first-floor of Permit Room Portobello – a very nice room, for a very big crowd (for up to 50 guests).\n\n\n"}},{"@type":"Question","name":"Does Dishoom Covent Garden have outdoor seating?","acceptedAnswer":{"@type":"Answer","text":"Yes, all cafés (except Dishoom Kensington and Manchester) open out into the air* for patrons to feast under fresh skies. Bask in the best of sunnier days, or bring character to your lunch with a playful breeze or bluster. Indeed, everything tastes better outside…\n\nPassersby may also wish to pop into Dishoom Shoreditch’s indoor-outdoor Verandah, flooded with daylight, sensibly sheltered and suitably warm for year-round delight.\n\n*Kindly note:— due to the vagaries of weather, it is not possible to book our outdoor tables. When warmer months greet us, simply ask for a table outside upon arrival. We’ll do our best to accommodate."}},{"@type":"Question","name":"Can I make a booking for my birthday at Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"Yes, extra-special reservations are met with abundant joy – tell us it's a celebration when you book, and let your server know on arrival. If your party is for 6 or more, make a Group Booking for a big-hearted celebration. Sip on finest tipples and teetotals while tables are flooded with café favourites from our Group Feast menus (non veg., veg. and vegan options for all). Simply enquire here."}},{"@type":"Question","name":"Is Dishoom Covent Garden vegetarian, vegan and gluten-free friendly? ","acceptedAnswer":{"@type":"Answer","text":"Yes, our All Day menu is filled with much-loved vegetarian dishes, including Pau Bhaji, Makhmali Paneer, House Black Daal and Gunpowder Potatoes. We also have a dedicated vegan and gluten-free menu available. All diets are happily fed."}},{"@type":"Question","name":"Is Dishoom Covent Garden halal-friendly? ","acceptedAnswer":{"@type":"Answer","text":"Yes, all dishes on the All Day menu are halal-friendly. Pick freely. On the Breakfast menu, dishes that contain bacon or pork sausages are not halal. Plenty of options remain: cooked breakfasts, egg naan rolls and fresh fruits & grains. Do ask your server if you have any questions."}},{"@type":"Question","name":"How long is the queue at Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"At breakfast and lunchtime, walk right in – there will be little or no queue. After 6pm and on weekends, a queue gathers around the café at busier times. You’ll be refreshed with complimentary chai while you wait, and as soon as space allows, can take a seat at the bar with tipples and snacks while your table is readied. Total wait times can range from 30 minutes to 1 hour."}},{"@type":"Question","name":"How do I get to Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"The entrance to Dishoom Covent Garden is located on Upper St. Martin’s Lane. It is a short walk from Covent Garden Underground station on the Piccadilly line, and from Leicester Square Underground station on the Northern and Piccadilly lines (both around 5–7 minutes). The nearest Bus Stops are Cambridge Circus and Leicester Square."}},{"@type":"Question","name":"Is Dishoom Covent Garden wheelchair accessible?","acceptedAnswer":{"@type":"Answer","text":"Yes, Dishoom Covent Garden is wheelchair accessible, with a step-free entrance, accessible seating and a disabled loo. For any access needs, please phone ahead if you have any queries – we’re happy to help."}},{"@type":"Question","name":"What should I order at Dishoom Covent Garden?","acceptedAnswer":{"@type":"Answer","text":"Dip into our menus. Beloved morning dishes include Breakfast Naan Rolls, Akuri Pau and Date & Banana Porridge. At lunch: Vada Pau, generously filled khati rolls, Dishoom House Chaat and Chilli Broccoli Salad. At dinner, feast: crisp samosas, Dishoom Chicken Ruby, Chef’s Special Prawn Pathia and House Black Daal."}}]}</script>
