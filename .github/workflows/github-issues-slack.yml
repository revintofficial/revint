# Posts GitHub issue activity to Slack (Incoming Webhook).
#
# Important:
# - This workflow only runs when this file exists on the repository DEFAULT branch (e.g. main).
# - Secret must be repo-level Actions secret (not Dependabot-only):
#     Settings → Secrets and variables → Actions → New repository secret
#       Name:  SLACK_ISSUES_WEBHOOK_URL
#       Value: https://hooks.slack.com/services/...

name: GitHub issues → Slack

on:
  issues:
    types:
      - opened
      - reopened
      - closed
      - edited
      - deleted
      - transferred
      - labeled
      - unlabeled
      - assigned
      - unassigned

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ISSUES_WEBHOOK_URL }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::error::Missing repo secret SLACK_ISSUES_WEBHOOK_URL — add under Settings → Secrets and variables → Actions."
            exit 1
          fi
          python3 << 'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          action = os.environ["ISSUE_ACTION"].upper()
          num = os.environ["ISSUE_NUM"]
          title = os.environ["ISSUE_TITLE"]
          url = os.environ["ISSUE_URL"]
          repo = os.environ["REPO"]
          actor = os.environ["ACTOR"]
          text = f"*{action}* issue [#{num} {title}]({url}) — `{repo}` — @{actor}"
          body = json.dumps({"text": text}).encode("utf-8")

          webhook = os.environ["SLACK_WEBHOOK_URL"]
          req = urllib.request.Request(
              webhook,
              data=body,
              method="POST",
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  if raw:
                      print("Slack:", raw[:500])
                  print("HTTP", resp.status)
          except urllib.error.HTTPError as e:
              detail = e.read().decode("utf-8", errors="replace") or str(e)
              print("::error::Slack HTTP", e.code, detail[:2000])
              raise SystemExit(1) from None
          PY
